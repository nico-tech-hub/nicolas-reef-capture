name: ReefCapture
options:
  bundleIdPrefix: com.reefcapture
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  objectVersion: 77
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SWIFT_APPROACHABLE_CONCURRENCY: YES
  TARGETED_DEVICE_FAMILY: "1"
targets:
  ReefCapture:
    type: application
    platform: iOS
    sources:
      - ReefCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reefcapture.app
        INFOPLIST_FILE: ReefCapture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets:
        - ReefCaptureTests
  ReefCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReefCaptureTests
    dependencies:
      - target: ReefCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reefcapture.tests
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase is nonisolated ObjC; default MainActor isolation breaks inits/setUp overrides.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
